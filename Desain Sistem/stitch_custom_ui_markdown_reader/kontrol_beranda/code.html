<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */

        'on-info': '#FFFFFF',

        'light-on-primary': '#FFFFFF',

        'headline': ['"DM Sans"', 'sans-serif'],

      },
      fontSize: {

        'display-lg-mobile': ['32px', { lineHeight: '40px', letterSpacing: '-0.5px', fontWeight: '700' }],

        'headline-md': ['20px', { lineHeight: '28px', fontWeight: '600' }],
        'title-lg': ['16px', { lineHeight: '24px', fontWeight: '600' }],
        'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

<body class="bg-light-background text-primary font-body antialiased selection:bg-primary selection:text-white">
  <div class="min-h-[884px] max-w-[390px] mx-auto bg-light-background relative flex flex-col justify-between pb-28" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Top Header -->
    <header class="px-5 pt-8 pb-4 flex items-center justify-between">
      <button type="button" aria-label="Menu" class="w-11 h-11 rounded-full bg-white flex items-center justify-center border border-border shadow-sm active:scale-95 transition-all">
        <span class="material-symbols-outlined text-primary text-[22px]">menu</span>
      </button>

      <div class="flex items-center gap-2.5">
        <button type="button" aria-label="Notifikasi" class="relative w-11 h-11 rounded-full bg-white flex items-center justify-center border border-border shadow-sm active:scale-95 transition-all">
          <span class="material-symbols-outlined text-primary text-[22px]">notifications</span>
          <span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-danger animate-pulse"></span>
        </button>
        <div class="w-11 h-11 rounded-full overflow-hidden border-2 border-white shadow-sm">
          <img src="https://lh3.googleusercontent.com/aida/ALJJyrDoSJdtRbhnkqSsdmAO5VCF1ZI_7VbMzXgvWKNiC2S6-0DSRrInAv-fowtEUqWKaCSKSwcsNzpYH6KWhSn8dVgGuHlxEX0mKGAc5l3pT6IChf3TloqJyauNF5Wji-jFHJqjt7EgwSyueLEmT0kfcvOnH4P_TITgHzbosqAy2xHlQ6LaYSlou9TaQ5xU-bAOCM_F8PZiy-A2SS82RsZmKxqNXqPMFQdOFFPP4i8qKTvRn6PwI68k" alt="Foto Willy" class="w-full h-full object-cover">
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="px-5 space-y-6">

      <!-- Greeting & Summary -->
      <div>
        <span data-design-text-token="label-md" class="font-label text-label-md font-medium text-on-surface-muted">Selamat sore,</span>
        <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg font-bold text-primary tracking-tight">Rumah Willy</h1>
        <p data-design-text-token="body-md" class="font-body text-body-md text-on-surface-muted mt-0.5">3 dari 4 lampu menyala</p>
      </div>

      <!-- Room Chips (Horizontal Scroll) -->
      <nav aria-label="Kategori Ruangan" class="flex items-center gap-3 overflow-x-auto pb-1 hide-scrollbar -mx-5 px-5">
        <!-- Chip: Semua (Active) -->
        <button type="button" data-component-id="chip-room-active" data-component-type="chip" data-component-variant="filter" class="flex-shrink-0 w-16 h-16 rounded-md bg-primary text-white flex flex-col items-center justify-center gap-1 shadow-sm active:scale-95 transition-transform">
          <span class="material-symbols-outlined text-[20px]">grid_view</span>
          <span data-design-text-token="label-md" class="font-label text-label-md font-medium text-white">Semua</span>
        </button>

        <!-- Chip: Ruang Tengah -->
        <button type="button" class="flex-shrink-0 w-16 h-16 rounded-md bg-white border border-border text-on-surface-muted flex flex-col items-center justify-center gap-1 hover:border-primary active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[20px] text-primary">weekend</span>
          <span data-design-text-token="label-md" class="font-label text-label-md font-medium text-on-surface-muted">Tengah</span>
        </button>

        <!-- Chip: Kamar Tidur -->
        <button type="button" class="flex-shrink-0 w-16 h-16 rounded-md bg-white border border-border text-on-surface-muted flex flex-col items-center justify-center gap-1 hover:border-primary active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[20px] text-on-surface-muted">bed</span>
          <span data-design-text-token="label-md" class="font-label text-label-md font-medium text-on-surface-muted">Kamar</span>
        </button>

        <!-- Chip: Dapur -->
        <button type="button" class="flex-shrink-0 w-16 h-16 rounded-md bg-white border border-border text-on-surface-muted flex flex-col items-center justify-center gap-1 hover:border-primary active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[20px] text-on-surface-muted">kitchen</span>
          <span data-design-text-token="label-md" class="font-label text-label-md font-medium text-on-surface-muted">Dapur</span>
        </button>

        <!-- Chip: Depan -->
        <button type="button" class="flex-shrink-0 w-16 h-16 rounded-md bg-white border border-border text-on-surface-muted flex flex-col items-center justify-center gap-1 hover:border-primary active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[20px] text-on-surface-muted">door_front</span>
          <span data-design-text-token="label-md" class="font-label text-label-md font-medium text-on-surface-muted">Depan</span>
        </button>
      </nav>

      <!-- Perangkat Section -->
      <section>
        <div class="flex items-center justify-between mb-3.5">
          <h2 data-design-text-token="title-lg" class="font-title text-title-lg font-semibold text-primary">Perangkat</h2>
          <button type="button" aria-label="Opsi perangkat" class="text-on-surface-muted hover:text-primary">
            <span class="material-symbols-outlined text-[20px]">more_horiz</span>
          </button>
        </div>

        <!-- 2-Column Device Grid -->
        <div class="grid grid-cols-2 gap-3">

          <!-- Card 1: Ruang Tengah (Active) -->
          <a href="../detail-lampu/DetailLampu.html" class="block w-full h-[166px] bg-primary text-white p-4 rounded-xl flex flex-col justify-between shadow-[0_8px_24px_rgba(17,17,17,0.12)] active:scale-[0.98] transition-all">
            <div class="flex items-center justify-between">
              <span class="material-symbols-outlined text-[24px]">light</span>
              <!-- Toggle Pill On -->
              <div class="w-12 h-7 bg-white/20 rounded-full p-0.5 flex justify-end items-center">
                <span class="w-6 h-6 rounded-full bg-white shadow-sm inline-block"></span>
              </div>
            </div>
            <div>
              <h3 data-design-text-token="title-lg" class="font-title text-title-lg font-semibold text-white">Ruang Tengah</h3>
              <p data-design-text-token="body-md" class="font-body text-body-md text-white/70">Aktif • 100%</p>
            </div>
          </a>

          <!-- Card 2: Kamar Tidur (Inactive) -->
          <a href="../detail-lampu/DetailLampu.html" class="block w-full h-[166px] bg-white border border-border p-4 rounded-xl flex flex-col justify-between shadow-[0_8px_24px_rgba(17,17,17,0.04)] active:scale-[0.98] transition-all">
            <div class="flex items-center justify-between">
              <span class="material-symbols-outlined text-[24px] text-on-surface-muted">bed</span>
              <!-- Toggle Pill Off -->
              <div class="w-12 h-7 bg-surface-muted rounded-full p-0.5 flex justify-start items-center">
                <span class="w-6 h-6 rounded-full bg-white shadow-sm inline-block"></span>
              </div>
            </div>
            <div>
              <h3 data-design-text-token="title-lg" class="font-title text-title-lg font-semibold text-primary">Kamar Tidur</h3>
              <p data-design-text-token="body-md" class="font-body text-body-md text-on-surface-muted">Mati</p>
            </div>
          </a>

          <!-- Card 3: Dapur (Active 70%) -->
          <a href="../detail-lampu/DetailLampu.html" class="block w-full h-[166px] bg-primary text-white p-4 rounded-xl flex flex-col justify-between shadow-[0_8px_24px_rgba(17,17,17,0.12)] active:scale-[0.98] transition-all">
            <div class="flex items-center justify-between">
              <span class="material-symbols-outlined text-[24px]">kitchen</span>
              <div class="w-12 h-7 bg-white/20 rounded-full p-0.5 flex justify-end items-center">
                <span class="w-6 h-6 rounded-full bg-white shadow-sm inline-block"></span>
              </div>
            </div>
            <div>
              <h3 data-design-text-token="title-lg" class="font-title text-title-lg font-semibold text-white">Lampu Dapur</h3>
              <p data-design-text-token="body-md" class="font-body text-body-md text-white/70">Aktif • 70%</p>
            </div>
          </a>

          <!-- Card 4: Lampu Depan (Active 47%) -->
          <a href="../detail-lampu/DetailLampu.html" class="block w-full h-[166px] bg-primary text-white p-4 rounded-xl flex flex-col justify-between shadow-[0_8px_24px_rgba(17,17,17,0.12)] active:scale-[0.98] transition-all">
            <div class="flex items-center justify-between">
              <span class="material-symbols-outlined text-[24px]" data-original-icon="outdoor_lamp">circle</span>
              <div class="w-12 h-7 bg-white/20 rounded-full p-0.5 flex justify-end items-center">
                <span class="w-6 h-6 rounded-full bg-white shadow-sm inline-block"></span>
              </div>
            </div>
            <div>
              <h3 data-design-text-token="title-lg" class="font-title text-title-lg font-semibold text-white">Lampu Depan</h3>
              <p data-design-text-token="body-md" class="font-body text-body-md text-white/70">Aktif • 47%</p>
            </div>
          </a>

        </div>
      </section>

      <!-- Pompa Air Section -->
      <section>
        <h2 data-design-text-token="title-lg" class="font-title text-title-lg font-semibold text-primary mb-3">Pompa Air</h2>
        <div class="w-full bg-white border border-border p-4 rounded-xl flex items-center justify-between shadow-[0_8px_24px_rgba(17,17,17,0.04)]">
          <div class="flex items-center gap-3.5">
            <div class="w-12 h-12 rounded-lg bg-surface-variant flex items-center justify-center">
              <span class="material-symbols-outlined text-[26px] text-info">water_pump</span>
            </div>
            <div>
              <h3 data-design-text-token="title-lg" class="font-title text-title-lg font-semibold text-primary">Pompa Air</h3>
              <p data-design-text-token="body-md" class="font-body text-body-md text-on-surface-muted">Nonaktif • Tandon Utama</p>
            </div>
          </div>
          <button type="button" aria-label="Nyalakan Pompa Air" class="w-12 h-7 bg-surface-muted rounded-full p-0.5 flex justify-start items-center">
            <span class="w-6 h-6 rounded-full bg-white shadow-sm inline-block"></span>
          </button>
        </div>
      </section>

      <!-- Action: Matikan Semua Lampu -->
      <div class="pt-1">
        <button type="button" class="w-full h-12 py-3 px-4 bg-surface-muted border border-border rounded-md font-label text-label-lg font-semibold text-primary flex items-center justify-center gap-2 hover:bg-border active:scale-[0.99] transition-all">
          <span class="material-symbols-outlined text-[20px]">power_settings_new</span>
          <span data-design-text-token="label-lg">Matikan semua lampu</span>
        </button>
      </div>

    </main>

    <!-- Floating Pill Bottom Navigation -->
    <div class="fixed bottom-6 left-0 right-0 max-w-[390px] mx-auto px-6 pointer-events-none z-30">
      <nav aria-label="Navigasi Utama" class="pointer-events-auto bg-white border border-border/80 shadow-[0_12px_32px_rgba(17,17,17,0.12)] rounded-full p-2 flex items-center justify-between">
        
        <!-- Tab 1: Kontrol (Active) -->
        <a href="KontrolBeranda.html" class="flex items-center gap-2 bg-primary text-white py-2 px-5 rounded-full font-label text-label-md font-semibold shadow-sm">
          <span class="material-symbols-outlined text-[20px]">tune</span>
          <span data-design-text-token="label-md">Kontrol</span>
        </a>

        <!-- Tab 2: Grafik -->
        <a href="../grafik-sensor/GrafikSensor.html" class="w-12 h-10 rounded-full flex items-center justify-center text-on-surface-muted hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-[22px]">monitoring</span>
        </a>

        <!-- Tab 3: Pengaturan -->
        <button type="button" class="w-12 h-10 rounded-full flex items-center justify-center text-on-surface-muted hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-[22px]">settings</span>
        </button>

      </nav>
    </div>

  </div>


</body></html>
